name: Publish owner-confirmed facts
on:
  pull_request_target:
    types: [closed]
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: identity-publish
  cancel-in-progress: false
jobs:
  confirm:
    if: github.event.pull_request.merged == true && github.event.pull_request.merged_by.login == 'RoyWG925' && github.event.sender.login == 'RoyWG925'
    runs-on: ubuntu-latest
    steps:
      # Only reviewed, owner-merged default-branch code is ever executed with write permission.
      # Do not change this to check out an unmerged pull_request.head SHA.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm run confirm
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm test && npm run check
      - name: Save confirmed canonical facts and all derived views
        run: |
          git config user.name 'roy-identity-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects evidence candidates receipts generated AI_CONTEXT.md
          if ! git diff --cached --quiet; then
            git commit -m 'Publish facts confirmed by Roy in reviewed PR'
            git push origin HEAD:main
          fi
