name: Validate identity data
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm test
      - run: npm run check
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: canonical
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: RoyWG925/RoyWG925
          path: profile
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: RoyWG925/portfolio-astro
          path: portfolio
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci
        working-directory: portfolio
      - run: npm install --prefix .pdf-tools --no-package-lock --no-save puppeteer@24.40.0
      - run: python -m pip install PyMuPDF==1.27.2.3
      - name: Promote fixture, generate, sync both consumers, build Astro and inspect rendered PDF
        run: node scripts/e2e.mjs
        working-directory: canonical
        env:
          IDENTITY_PROFILE_REPO: ${{ github.workspace }}/profile
          IDENTITY_PORTFOLIO_REPO: ${{ github.workspace }}/portfolio
          PUPPETEER_MODULE_PATH: ${{ github.workspace }}/.pdf-tools
