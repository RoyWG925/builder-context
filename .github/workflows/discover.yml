name: Discover public evidence
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: identity-discovery
  cancel-in-progress: false
jobs:
  propose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm test && npm run check
      - name: Collect public evidence and open independent proposals
        run: npm run scan
        env:
          GH_TOKEN: ${{ github.token }}
